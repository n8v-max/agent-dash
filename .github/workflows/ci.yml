name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A fixed, non-production signing key (R-T14). Deliberately a literal and
    # not a GitHub secret: the fixture is public, the two seeded accounts are
    # public, and a repo secret here would only be theatre. Production's key is
    # set in the Vercel dashboard and never appears in this repo.
    env:
      AUTH_JWT_SECRET: ci-not-a-production-key-000000000000000000

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # T-F9 / R-T21 / R-T35 — the committed fixture must still match the seed. This is the
      # only place the generator runs in CI; every other test reads the committed JSON.
      - name: Fixture output matches the seed
        run: |
          pnpm fixtures:generate --out "${RUNNER_TEMP}/fixtures"
          diff -r src/fixtures/data "${RUNNER_TEMP}/fixtures"

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # The Playwright config starts `next start` against this build when CI is set.
      # One browser download serves both projects: `mobile-chromium` is the same engine at a
      # 390x844 viewport (R-V15), not a second one.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Both projects, in one run: `pnpm e2e` names no project, so Playwright runs `chromium`
      # and `mobile-chromium` together against the one server it starts. Splitting them into two
      # steps would start the server twice for no gain.
      - name: End-to-end tests, at both widths
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
